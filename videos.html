<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories</title>
    <style>
        :root {
            color-scheme: light;
            --bg-1: #fff0f6;
            --bg-2: #fdf4ff;
            --text: #2b1d1f;
            --card: rgba(255, 255, 255, 0.82);
            --border: rgba(255, 255, 255, 0.95);
            --pink-1: #f07c9c;
            --pink-2: #f8a7be;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Quicksand", "Segoe UI", Tahoma, sans-serif;
            color: var(--text);
            padding: 96px 16px 46px;
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 199, 221, 0.55), transparent 35%),
                radial-gradient(circle at 84% 82%, rgba(221, 214, 254, 0.35), transparent 38%),
                linear-gradient(150deg, var(--bg-1), var(--bg-2));
        }

        .site-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255, 244, 246, 0.88);
            border-bottom: 1px solid rgba(43, 29, 31, 0.16);
            backdrop-filter: blur(8px);
            overflow-x: auto;
        }

        .site-tabs a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(43, 29, 31, 0.2);
            background: rgba(255, 255, 255, 0.8);
            color: #2b1d1f;
            text-decoration: none;
            font-family: "Quicksand", "Segoe UI", Tahoma, sans-serif;
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
        }

        .site-tabs a.active {
            background: #2b1d1f;
            color: #fff4f6;
            border-color: #2b1d1f;
        }

        .tab-home img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 6px;
            font-size: clamp(30px, 4vw, 46px);
            text-align: center;
            letter-spacing: 0.4px;
            color: #3a2328;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            margin: 0 0 24px;
            text-align: center;
            color: #6e4752;
            font-size: clamp(14px, 2vw, 17px);
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 26px rgba(78, 43, 55, 0.14);
            transition: transform 140ms ease, box-shadow 140ms ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(78, 43, 55, 0.2);
        }

        .label {
            margin: 0 0 10px;
            font-weight: 800;
            font-size: 15px;
            color: #7d3f51;
        }

        video {
            width: 100%;
            height: 320px;
            border-radius: 14px;
            border: 2px solid rgba(240, 124, 156, 0.25);
            background: #000;
            object-fit: cover;
            outline: none;
        }
    </style>
</head>
<body>
    <nav class="site-tabs" aria-label="Page navigation">
        <a class="tab-home" href="index.html" aria-label="Home"><img src="N.png" alt="Home"></a>
        <a href="1.html">Letter</a>
        <a href="2.html">Audio</a>
        <a class="active" href="videos.html">Memories</a>
    </nav>

    <div class="wrap">
        <h1>Memories</h1>
        <p class="subtitle">All these moments have a special place in My Heart ✨</p>

        <main class="grid">
            <section class="card">
                <p class="label">Haha Cute</p>
                <video controls preload="metadata">
                    <source src="./muscle.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </section>

            <section class="card">
                <p class="label">Woooow Kitni achi lagri hai</p>
                <video controls preload="metadata">
                    <source src="./piercing.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </section>

            <section class="card">
                <p class="label">Ambitious Nainaaa</p>
                <video controls preload="metadata">
                    <source src="./study.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </section>

            <section class="card">
                <p class="label">Killer Looks Bhaisaab🫠😻</p>
                <video controls preload="metadata">
                    <source src="./suit.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </section>
        </main>
    </div>
</body>
</html>
