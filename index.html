<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nainaaaa!🫶</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, #ffe7c7 0%, #ffd2dd 35%, #f6b7c6 70%, #e89aac 100%);
            overflow: hidden;
        }

        #confetti {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }

        .center-title {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            font-family: "Georgia", "Times New Roman", serif;
            color: #FFFFFF;
            text-align: center;
            font-size: clamp(28px, 5vw, 56px);
            letter-spacing: 0.5px;
        }

        .birthday-show {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            height: 100%;
        }

        .birthday-show.is-hidden {
            display: none;
        }

        .birthday-flag {
            width: min(220px, 42vw);
            max-width: 220px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(43, 29, 31, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.7);
        }

        #birthdayWish {
            color: #2b1d1f;
        }

        .start-button {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            background: #2b1d1f;
            color: #fff4f6;
            text-decoration: none;
            font-size: clamp(16px, 2.4vw, 22px);
            letter-spacing: 0.4px;
            transform: translateY(4px);
            transition: transform 160ms ease, box-shadow 160ms ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .start-button:hover {
            transform: translateY(0);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }

        .site-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255, 244, 246, 0.88);
            border-bottom: 1px solid rgba(43, 29, 31, 0.16);
            backdrop-filter: blur(8px);
            overflow-x: auto;
        }

        .site-tabs.is-hidden {
            display: none;
        }

        .site-tabs a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(43, 29, 31, 0.2);
            background: rgba(255, 255, 255, 0.8);
            color: #2b1d1f;
            text-decoration: none;
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 16px;
            white-space: nowrap;
        }

        .site-tabs a.active {
            background: #2b1d1f;
            color: #fff4f6;
            border-color: #2b1d1f;
        }

        .tab-home img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }

        .password-gate {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(43, 29, 31, 0.35);
            backdrop-filter: blur(8px);
        }

        .password-panel {
            width: min(420px, 100%);
            padding: 32px;
            border: 1px solid rgba(181, 82, 106, 0.2);
            border-radius: 22px;
            background: linear-gradient(140deg, #fff7ee 0%, #ffeef4 45%, #fff7ee 100%);
            box-shadow: 0 24px 60px rgba(26, 12, 16, 0.24);
            color: #2b1d1f;
            font-family: "Georgia", "Times New Roman", serif;
        }

        .password-panel h1 {
            margin: 0 0 8px;
            color: #b5526a;
            font-size: 28px;
            text-align: center;
        }

        .password-panel p {
            margin: 0 0 22px;
            text-align: center;
        }

        .password-panel label {
            display: block;
            margin-bottom: 8px;
        }

        .password-panel input {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid rgba(43, 29, 31, 0.3);
            border-radius: 10px;
            background: #fff;
            color: #2b1d1f;
            font: inherit;
        }

        .password-panel button {
            width: 100%;
            min-height: 46px;
            margin-top: 14px;
            border: 0;
            border-radius: 999px;
            background: #2b1d1f;
            color: #fff4f6;
            font: inherit;
            cursor: pointer;
        }

        .password-error {
            min-height: 1.25em;
            margin: 12px 0 0 !important;
            color: #9d2947;
            text-align: left !important;
        }

    </style>
</head>
<body>
    <section id="passwordGate" class="password-gate" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
        <form id="passwordForm" class="password-panel">
            <h1 id="passwordTitle">A little surprise</h1>
            <p>Enter the password to continue.</p>
            <label for="sitePassword">Password</label>
            <input id="sitePassword" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">Unlock</button>
            <p id="passwordError" class="password-error" role="status" aria-live="polite"></p>
        </form>
    </section>

    <nav id="siteTabs" class="site-tabs is-hidden" aria-label="Page navigation" inert>
        <a class="tab-home active" href="index.html" aria-label="Home"><img src="N.png" alt="Home"></a>
        <a href="1.html">Letter</a>
        <a href="2.html">Audio</a>
        <a href="videos.html">Memories</a>
    </nav>
    <canvas id="confetti" aria-hidden="true" inert></canvas>
    <div class="birthday-show is-hidden" id="birthdayShow" inert>
        <img src="us.png" alt="United States flag" class="birthday-flag">
        <div class="center-title" id="birthdayWish">Happy 18ᵗʰ Birthday My Pretty Yapper!</div>
        <a class="start-button" id="startButton" href="1.html">Let’s gooooo</a>
    </div>

    <script>
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        const colors = ["#fff4b0", "#f07c9c", "#f7d6ff", "#ffe066", "#9bf6ff", "#ff99c8"];
        const confettiCount = 160;
        const confetti = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        function createPiece() {
            return {
                x: rand(0, width),
                y: rand(-height, 0),
                w: rand(6, 12),
                h: rand(8, 16),
                r: rand(0, Math.PI * 2),
                tilt: rand(-0.6, 0.6),
                color: colors[Math.floor(rand(0, colors.length))],
                speed: rand(1.2, 3.4),
                drift: rand(-0.8, 0.8),
                rotation: rand(-0.04, 0.04)
            };
        }

        function init() {
            confetti.length = 0;
            for (let i = 0; i < confettiCount; i += 1) {
                confetti.push(createPiece());
            }
        }

        function update() {
            ctx.clearRect(0, 0, width, height);

            confetti.forEach((piece) => {
                piece.y += piece.speed;
                piece.x += piece.drift;
                piece.r += piece.rotation;

                if (piece.y > height + 20) {
                    piece.y = rand(-height * 0.2, -20);
                    piece.x = rand(0, width);
                }

                if (piece.x < -20) piece.x = width + 20;
                if (piece.x > width + 20) piece.x = -20;

                ctx.save();
                ctx.translate(piece.x, piece.y);
                ctx.rotate(piece.r);
                ctx.fillStyle = piece.color;
                ctx.fillRect(-piece.w / 2, -piece.h / 2, piece.w, piece.h);
                ctx.restore();
            });

            requestAnimationFrame(update);
        }

        let confettiRunning = false;

        function startConfetti() {
            if (confettiRunning) return;
            confettiRunning = true;
            canvas.style.display = "block";
            resize();
            init();
            update();
        }

        window.addEventListener("resize", () => {
            if (!confettiRunning) return;
            resize();
            init();
        });

        const birthdayShow = document.getElementById("birthdayShow");
        const siteTabs = document.getElementById("siteTabs");

        const passwordGate = document.getElementById("passwordGate");
        const passwordForm = document.getElementById("passwordForm");
        const sitePassword = document.getElementById("sitePassword");
        const passwordError = document.getElementById("passwordError");

        passwordForm.addEventListener("submit", (event) => {
            event.preventDefault();

            if (sitePassword.value !== "Nainaaa") {
                passwordError.textContent = "That password doesn't match. Try again.";
                sitePassword.select();
                return;
            }

            passwordGate.remove();
            siteTabs.inert = false;
            canvas.inert = false;
            birthdayShow.inert = false;
            birthdayShow.classList.remove("is-hidden");
            siteTabs.classList.remove("is-hidden");
            startConfetti();
        });
    </script>
</body>
</html>
